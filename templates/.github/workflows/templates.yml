name: Project template safety
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test project isolation and truthful registration proposals
        run: python -m unittest discover -s tests -v
      - name: Generate explicit synthetic fixture
        run: python scripts/start_project.py init --spec examples/synthetic-intake.json --output "$RUNNER_TEMP/template-demo" --allow-example > "$RUNNER_TEMP/template-generation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-generation-evidence
          path: ${{ runner.temp }}/template-generation.json
          if-no-files-found: error
