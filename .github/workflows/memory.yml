name: Native memory acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/cloudkit/assets/native_memory/**'
      - 'src/cloudkit/runtime/memoryctl.py'
      - 'src/cloudkit/runtime/governance.py'
      - 'scripts/verify_memory.py'
      - '.github/workflows/memory.yml'
  pull_request:
    paths:
      - 'src/cloudkit/assets/native_memory/**'
      - 'src/cloudkit/runtime/memoryctl.py'
      - 'src/cloudkit/runtime/governance.py'
      - 'scripts/verify_memory.py'
      - '.github/workflows/memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-memory-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
          enable-cache: false
      - run: python -m pip install .
      - run: cloudkit setup --profile memory --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
      - name: Verify locked model and native inference with networking disabled
        run: '"$RUNNER_TEMP/cloudkit-runtime/memory/.venv/bin/python" "$RUNNER_TEMP/cloudkit-runtime/memory/verify_model.py"'
      - run: python scripts/verify_memory.py --runtime-root "$RUNNER_TEMP/cloudkit-runtime" --output "$RUNNER_TEMP/native-memory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-memory-acceptance
          path: ${{ runner.temp }}/native-memory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-model-validation
          path: ${{ runner.temp }}/cloudkit-runtime/memory/model-runtime-validation.json
          if-no-files-found: error
