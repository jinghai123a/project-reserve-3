name: Queue acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/cloudkit/assets/queue/**'
      - 'src/cloudkit/runtime/queue_bridge.py'
      - 'scripts/verify_queue.py'
      - '.github/workflows/queue.yml'
  pull_request:
    paths:
      - 'src/cloudkit/assets/queue/**'
      - 'src/cloudkit/runtime/queue_bridge.py'
      - 'scripts/verify_queue.py'
      - '.github/workflows/queue.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: queue-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Prepare real Redis
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y redis-server
          fi
      - run: python -m pip install .
      - run: cloudkit setup --profile queue --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
      - run: '"$RUNNER_TEMP/cloudkit-runtime/queue/.venv/bin/python" scripts/verify_queue.py --redis-server "$(command -v redis-server)" --output "$RUNNER_TEMP/queue-acceptance.json"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-acceptance
          path: ${{ runner.temp }}/queue-acceptance.json
