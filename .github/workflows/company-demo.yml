name: Company end-to-end demonstration
on:
  push:
    branches: [main]
    paths:
      - 'examples/company_demo/**'
      - 'examples/company_rehearsal.py'
      - 'src/cloudkit/runtime/**'
      - '.github/workflows/company-demo.yml'
  pull_request:
    paths:
      - 'examples/company_demo/**'
      - 'examples/company_rehearsal.py'
      - 'src/cloudkit/runtime/**'
      - '.github/workflows/company-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Rehearse reviewed task dependencies and durable recovery
        run: python examples/company_rehearsal.py --output "$RUNNER_TEMP/company-evidence/rehearsal.json"
      - name: Verify real HTTP and SQLite restart behavior
        run: python examples/company_demo/verify.py --output "$RUNNER_TEMP/company-evidence/http.json"
      - name: Install locked browser test dependencies
        working-directory: examples/company_demo
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise the delivered interface in real Chromium
        working-directory: examples/company_demo
        run: node browser-test.cjs --output "$RUNNER_TEMP/company-evidence/browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: company-demonstration-evidence
          path: ${{ runner.temp }}/company-evidence
          if-no-files-found: error
