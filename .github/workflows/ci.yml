name: CloudKit core acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/**'
      - 'templates/**'
      - '.codex/**'
      - 'company/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/**'
      - 'templates/**'
      - '.codex/**'
      - 'company/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudkit-core-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s deploy -p 'test_*.py' -v
      - run: python -m unittest discover -s templates/tests -v
      - run: cloudkit setup --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
      - run: cloudkit doctor --runtime-root "$RUNNER_TEMP/cloudkit-runtime"
