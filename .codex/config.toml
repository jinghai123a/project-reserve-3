# Codex rust-v0.162.1 config.schema.json; no model or permission overrides.
# 6 is a concurrency cap, not a pre-started team. max_depth is V1-specific.
[agents]
enabled = true
max_concurrent_threads_per_session = 6
max_depth = 2

[agents.product_manager]
description = "产品研究主管，兼任体验负责人，定义结果与验收。"
config_file = "agents/product_manager.toml"

[agents.product_analyst]
description = "研究与需求分析，核验来源并形成可测试用户场景。"
config_file = "agents/product_analyst.toml"

[agents.ui_designer]
description = "交互、组件和可访问性约束，按界面需求启用。"
config_file = "agents/ui_designer.toml"

[agents.architecture_manager]
description = "架构主管，解决跨模块契约与开源组件选择。"
config_file = "agents/architecture_manager.toml"

[agents.architecture_researcher]
description = "开源选型、API/数据契约与可靠性研究。"
config_file = "agents/architecture_researcher.toml"

[agents.engineering_manager]
description = "工程主管，分配实现范围并完成组合行为验证。"
config_file = "agents/engineering_manager.toml"

